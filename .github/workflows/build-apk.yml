name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify transparent Billar Azteca logo
        run: |
          test -s app/src/main/res/drawable/billar_azteca_logo.png
          file app/src/main/res/drawable/billar_azteca_logo.png

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BillarAzteca-Marcador-v7
          path: app/build/outputs/apk/debug/app-debug.apk
